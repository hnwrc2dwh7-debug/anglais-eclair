<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Anglais Éclair</title>
  <meta name="description" content="Apprends l’anglais à la vitesse de l’éclair : 1 700 mots en images, les 12 temps, plus de 230 verbes irréguliers, jeux, révisions intelligentes et programme jour par jour. Gratuit, sans compte, sans IA.">
  <meta name="theme-color" content="#3d5afe">
  <meta property="og:title" content="Anglais Éclair ⚡ L’anglais sans délai">
  <meta property="og:description" content="1 700 mots en images, les 12 temps, les verbes irréguliers, des jeux et un programme jour par jour. Gratuit et sans compte.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#accueil" aria-label="Anglais Éclair, accueil">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 13.5h6.5L9 22l10-12h-6.6L13.5 2Z" fill="var(--spark-base)" stroke="#1c1600" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">Anglais Éclair<small>l’anglais sans délai</small></span>
      </a>
      <nav class="menus" id="menus" aria-label="Menu principal"></nav>
      <div class="top-right">
        <form class="top-search" id="topSearch" role="search">
          <span aria-hidden="true">⌕</span>
          <label class="sr-only" for="searchInput">Chercher un mot</label>
          <input id="searchInput" type="search" placeholder="Chercher un mot…" autocomplete="off">
        </form>
        <button class="mode-btn" id="modeBtn" type="button">🎒 <span>Élève</span></button>
        <a class="pill-stat xp" href="#stats" id="xpPill" title="Points du jour">⚡ 0</a>
        <a class="pill-stat" href="#stats" id="streakPill" title="Série de jours">🔥 0</a>
        <a class="icon-btn search-icon" href="#recherche" title="Chercher" aria-label="Chercher">🔎</a>
        <a class="icon-btn help-btn" href="#aide" title="Aide" aria-label="Aide">❓</a>
        <a class="icon-btn set-btn" href="#reglages" title="Réglages" aria-label="Réglages">⚙️</a>
        <button class="icon-btn burger" id="burger" type="button" aria-label="Ouvrir le menu" aria-controls="drawer" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer-head">
      <strong class="brand-name">Menu</strong>
      <button class="icon-btn" id="drawerClose" type="button" aria-label="Fermer le menu">✕</button>
    </div>
    <form id="drawerSearch" role="search" style="margin-bottom:10px">
      <label class="sr-only" for="drawerSearchInput">Chercher un mot</label>
      <input id="drawerSearchInput" type="search" placeholder="🔎 Chercher un mot, une phrase…" autocomplete="off">
    </form>
    <div id="drawerMenus"></div>
  </aside>

  <main class="page" id="app" tabindex="-1"></main>

  <footer class="footer">
    <span>⚡ Anglais Éclair · gratuit, sans compte, sans IA · tes progrès restent sur cet appareil.</span>
    <span><a href="#aide">Aide</a> · <a href="#partager">Partager</a> · <a href="#enseignants">Pour les enseignants</a> · <a href="#reglages">Réglages</a> · <a href="#stats">Mes progrès</a></span>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Navigation rapide">
    <a href="#accueil" data-tab="accueil"><span>🏠</span>Accueil</a>
    <a href="#vocabulaire" data-tab="vocabulaire"><span>🧠</span>Mots</a>
    <a href="#temps" data-tab="temps"><span>⏳</span>Temps</a>
    <a href="#jeux" data-tab="jeux"><span>🎮</span>Jeux</a>
    <a href="#verbes" data-tab="verbes"><span>🔁</span>Verbes</a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data/vocab-1.js"></script>
  <script src="assets/js/data/vocab-2.js"></script>
  <script src="assets/js/data/vocab-3.js"></script>
  <script src="assets/js/data/vocab-4.js"></script>
  <script src="assets/js/data/vocab-5.js"></script>
  <script src="assets/js/data/grammar.js"></script>
  <script src="assets/js/data/verbs.js"></script>
  <script src="assets/js/data/expressions.js"></script>
  <script src="assets/js/data/stories.js"></script>
  <script src="assets/js/data/sentences.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/views-learn.js"></script>
  <script src="assets/js/views-grammar.js"></script>
  <script src="assets/js/views-more.js"></script>
  <script src="assets/js/games.js"></script>
  <script src="assets/js/plan-settings.js"></script>
  <script src="assets/js/vendor/qrcode.js"></script>
  <script src="assets/js/help.js"></script>
  <script src="assets/js/fiches.js"></script>
  <script src="assets/js/views-stories.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
